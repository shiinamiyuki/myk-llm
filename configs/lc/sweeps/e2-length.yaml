# E2 - retrieval at length (main experiment): 8 records in noise, 4 queried; trained on
# 128-2048 tokens, evaluated to 64K with the same 8 records (only the distance grows).
#   python -m myk_llm.lc.sweep configs/lc/sweeps/e2-length.yaml
#   python -m myk_llm.lc.sweep configs/lc/sweeps/e2-length.yaml --report --at 16384
name: e2-length
configs:
  needle: configs/lc/needle.yaml
axes:
  arch:
    G_rope: [model.layer_pattern=G, model.attention.global_rope=all]
    G_nope: [model.layer_pattern=G, model.attention.global_rope=none]
    GL: [model.layer_pattern=GL, model.attention.global_rope=first]       # the 200M recipe
    GLLL: [model.layer_pattern=GLLL, model.attention.global_rope=first]   # the 600M recipe
    GLLL_nope: [model.layer_pattern=GLLL, model.attention.global_rope=none]
    L: [model.layer_pattern=L]                                            # control
    D: [model.layer_pattern=D]
    D_noconv: [model.layer_pattern=D, model.deltanet.use_short_conv=false]
    GD: [model.layer_pattern=GD, model.attention.global_rope=none]
    DDDG: [model.layer_pattern=DDDG, model.attention.global_rope=none]
  seed:
    s0: [seed=0]
    s1: [seed=1]
