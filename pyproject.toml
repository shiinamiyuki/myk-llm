[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myk-llm"
version = "0.1.0"
description = "Simple CUDA-only LLM training and inference project for learning."
requires-python = ">=3.12"
dependencies = [
	"numpy>=1.26",
	"safetensors>=0.4",
	"torch>=2.5",
	"flash-attn>=2.6.0",
	"transformers>=4.46",
]

[tool.setuptools]
py-modules = []
